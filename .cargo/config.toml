# mimalloc on the static Linux build: no transparent huge pages. With them (host THP mode
# "madvise" or "always"), each thread's sparse pages are faulted in 2 MiB at a time, which more
# than doubled peak memory. MIMALLOC_ALLOW_THP=1 in the environment turns them back on.
[env]
CFLAGS_x86_64_unknown_linux_musl = "-DMI_DEFAULT_ALLOW_THP=0"
CFLAGS_aarch64_unknown_linux_musl = "-DMI_DEFAULT_ALLOW_THP=0"
