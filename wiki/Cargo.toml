[package]
name = "wiki"
version = "0.3.0"
edition = "2021"
description = "Deterministic wiki compiler for agent-navigable knowledge bases"
license = "MIT"
publish = false

[[bin]]
name = "wiki"
path = "src/main.rs"

[lib]
name = "wiki"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
ignore = "0.4"
regex = "1"
notify = "6"
tree-sitter = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
rmcp = { version = "2", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["rt", "io-std", "macros"] }

[dev-dependencies]
insta = "1"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
criterion = "0.5"

[[bench]]
name = "pipeline"
harness = false
