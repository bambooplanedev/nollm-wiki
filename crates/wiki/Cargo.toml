[package]
name = "wiki"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Deterministic wiki compiler for agent-navigable knowledge bases"
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "wiki"
path = "src/main.rs"

[lib]
name = "wiki"
path = "src/lib.rs"

[dependencies]
wiki-code = { path = "../wiki-code" }
techlog = { path = "../techlog" }
aho-corasick = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
blake3 = "1"
ignore = "0.4"
regex = "1"
notify = "9"
frostem = { version = "=2.20261016.3", default-features = false, features = ["english", "ukrainian"] }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", features = ["override"] }

[dev-dependencies]
insta = "1"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
criterion = "0.8"

[[bench]]
name = "pipeline"
harness = false
