[package]
name = "plaz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Per-function decision charts and call targets of a codebase, drawn deterministically from its syntax trees"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
wiki-code = { path = "../wiki-code" }
thiserror = "2.0.21"
serde_json = "1.0.154"

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", features = ["override"] }

[dev-dependencies]
wiki-code = { path = "../wiki-code", features = ["test-util"] }
assert_cmd = "2.2.2"
insta = "1.49.0"
tempfile = "3.27.0"

[lints]
workspace = true
